<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .petal { fill: #d35d6e; }
      .stem { stroke: #2d5016; stroke-width: 2; fill: none; }
      .leaf { fill: #4a7c2c; }
    </style>
  </defs>
  <!-- Stem -->
  <path class="stem" d="M50,100 Q48,75 50,50"/>
  <!-- Leaves -->
  <ellipse class="leaf" cx="35" cy="70" rx="8" ry="12" transform="rotate(-30 35 70)"/>
  <ellipse class="leaf" cx="65" cy="65" rx="8" ry="12" transform="rotate(30 65 65)"/>
  <!-- Rose petals (layered effect) -->
  <circle class="petal" cx="50" cy="30" r="12" opacity="0.8"/>
  <circle class="petal" cx="45" cy="25" r="10" opacity="0.9"/>
  <circle class="petal" cx="55" cy="25" r="10" opacity="0.9"/>
  <circle class="petal" cx="42" cy="30" r="9" opacity="1"/>
  <circle class="petal" cx="58" cy="30" r="9" opacity="1"/>
  <circle class="petal" cx="50" cy="22" r="7" opacity="1"/>
</svg>